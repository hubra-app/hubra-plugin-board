id: board
name: Board
version: "1.1.0"
hubra: ">=0.2.6,<1"
description: "What the board (Vorstand) runs: tasks per function that pass to the next holder, a year planner of recurring duties, a register of contracts and insurances with notice reminders, and the general meeting (Generalversammlung) from invitation and agenda to sign-in, quorum and minutes."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-board
tags: [board, vorstand, gv, tasks, contracts]
package: hubra_board
modules: [board]
requires: [members, functions]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, jobs, nav, frontend, contracts]
